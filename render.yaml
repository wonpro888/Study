services:
  - type: web
    name: panda-market-mission-5-api
    runtime: node
    plan: free
    branch: sprint-mission-5
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DB_CONNECT
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
  - type: web
    name: panda-market-mission-5
    runtime: static
    branch: sprint-mission-5
    rootDir: client
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
